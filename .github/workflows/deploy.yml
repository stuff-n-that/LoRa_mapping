name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refreshes the embedded live-node snapshot even with no code changes.
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            planner/package-lock.json
      - run: npm ci
      - name: Fetch live node data, sharded by country
        run: node scripts/pull-live-nodes.mjs public/regions
        continue-on-error: true # ship the deploy even if both upstream APIs are briefly down
      - run: npm run build
      - name: Planner — install, check, test, build
        # The tests compare the propagation engine against NTIA's reference
        # values, so a broken engine stops the deploy instead of shipping.
        working-directory: planner
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Assemble site (landing page at root, map app under /map/, planner under /plan/)
        run: |
          mkdir -p site
          cp -r landing/. site/
          mkdir -p site/map
          cp -r dist/. site/map/
          mkdir -p site/plan
          cp -r planner/dist/. site/plan/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
